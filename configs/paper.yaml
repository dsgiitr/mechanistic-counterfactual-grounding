# Experimental settings of the paper.
# Every experiment script reads this file; command-line flags override single values.

seed: 0

models:                         # keys of mcg.models.MODEL_REGISTRY
  stability: [llava-1.5-7b, qwen3-vl-8b-thinking, smolvlm-500m, smolvlm-256m]

datasets: [pope, coco, hallusionbench]

data:
  pope:
    dataset: lmms-lab/POPE
    config: Full
    split: random               # 3,000 questions
  hallusionbench:
    dataset: lmms-lab/HallusionBench
    splits: [image, non_image]  # full benchmark; non_image items have no visual input
  coco:
    image_dir: data/coco/val2014
    instances: data/coco/annotations/instances_val2014.json
    chair_synonyms: data/coco/synonyms.txt   # CHAIR synonym list (scripts/download_data.sh)
    num_images: 500
    seed: 0

generation:
  max_new_tokens_binary: 16
  max_new_tokens_caption: 256
  max_new_tokens_reasoning: 4096 # Thinking model: reasoning trace + answer

examples:                       # Section 4.1
  num_hallucinated: 50          # first hallucinated items in benchmark order
  num_grounded: 50              # uniform random draw from correctly answered items
  distinct_images: true

counterfactuals:                # Section 3.1, Eq. 1: CVL donor mixing of projected visual tokens
  gate: 0.1                     # eps_g: u >= 1 - gate keeps the factual tokens
  beta_alpha: 0.1               # u ~ Beta(beta_alpha, beta_beta) unless a trained CVL checkpoint is given;
  beta_beta: 0.1                #   (0.1, 0.1) is the CVL prior before training
  beta_checkpoint: null         # training/ checkpoint.pt: its exogenous_alpha_v / exogenous_beta_v are used
  donor_exclude_top: 5          # donors contain neither the queried object nor its 5 most co-occurring categories
  K: {llava-1.5-7b: [50, 100, 150], qwen3-vl-8b-thinking: [50, 100, 150],
      qwen3-vl-8b-instruct: [50], smolvlm-500m: [50], smolvlm-256m: [50]}
  decodings: {50: 10, 100: 10, 150: 15}   # sampled decodings per counterfactual
  temperature: 0.7
  retention_margin: 1           # retain if correct in >= decodings - margin (9/10, 14/15)
  effects_on: retained          # "retained" (paper) or "all" (label-free variant, Section 6 step 2)

background:
  dataset: pope
  num_items: 500

cdt:                            # Appendix C
  k0: 4
  k_i: 4
  max_nodes: null
  batch_size: 16                # source heads propagated together
  max_attention_elements: 1.0e+9  # memory cap: batch is reduced for long (reasoning) sequences

bounds:                         # Section 4.1
  epsilon: 0.185
  delta: 0.05
  B: 0.6

restoration:
  batch_size: 16

budget_sensitivity:             # Appendix E (Figure 7)
  model: llava-1.5-7b
  dataset: pope
  num_examples: 50
  sizes: [5, 10, 20, 50, 100]
  random_draws: 5
  decay: 0.5
